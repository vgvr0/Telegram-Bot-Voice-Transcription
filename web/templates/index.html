<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Adminka</title>
</head>
<body>
<header>
    <h1 class="adminka">Adminka</h1>

    <div class="control_header">
        <a target="_blank" href="/newsletter">Newsletter</a>
        <a class="log_out" href="/logout">Logout</a>
    </div>


</header>

<main>


    {% for user in users %}
    <div class="card">
        <p class="card__id">ID: {{ user[0] }}</p>
        <p>name: {{ user[1] }}</p>
        <p>username: {{ user[2] }}</p>
        <p>language: {{ user[3] }}</p>
        <p>count_transcript: {{ user[4] }}</p>
        <p>registrate: {{ user[5] }}</p>
        <p>last_message: {{ user[6] }}</p>
        <hr>
        <div class="control_card">
            <button>Ban</button>
            <button>Send message</button>
        </div>
    </div>
    {% endfor %}









</main>


<footer>
    <p>vgvr0 & Plat Ilich</p>
    <p>Telegram-Bot-Voice-Transcription</p>
</footer>


</body>
</html>
